plugins {
    id "com.android.application"
}

android {
    namespace "com.wordoflife.biblequiz"
    compileSdk 36

    defaultConfig {
        applicationId "com.wordoflife.biblequiz"
        minSdk 24
        targetSdk 36
        versionCode 12
        versionName "1.11.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            // Release output is built unsigned until a private upload key is configured.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google Mobile Ads Next-Gen SDK.
    implementation "com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.6.0"
}

// Bundle the game files to preserve a stable WebView origin and saved progress.
// MainActivity blocks gameplay unless Android reports a validated internet connection.
tasks.register("syncGameAssets", Copy) {
    from(rootProject.file("../index.html"))
    into(layout.projectDirectory.dir("src/main/assets/www"))
    rename { "index.html" }
}

tasks.named("preBuild").configure {
    dependsOn("syncGameAssets")
}
