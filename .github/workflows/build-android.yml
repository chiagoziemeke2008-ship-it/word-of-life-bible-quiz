name: Build Word of Life Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android-app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build installable APK and Play Store bundle
        working-directory: android-app
        run: gradle --no-daemon assembleDebug bundleRelease

      - name: Upload Android files
        uses: actions/upload-artifact@v4
        with:
          name: word-of-life-android-build
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
